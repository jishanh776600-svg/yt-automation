name: Migrate Secrets
on: workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate secret names
        env:
          GH_TOKEN: ${{ secrets.TEMP_MIGRATE_TOKEN }}
          GROQ_VAL: ${{ secrets.GROQ_API }}
          OR_VAL: ${{ secrets.OPEN_ROUTER }}
        run: |
          set -e
          printf "%s" "$GROQ_VAL" | gh secret set GROQ_API_KEY --repo jishanh776600-svg/yt-automation
          printf "%s" "$OR_VAL" | gh secret set OPENROUTER_API_KEY --repo jishanh776600-svg/yt-automation
          gh secret delete GROQ_API --repo jishanh776600-svg/yt-automation
          gh secret delete OPEN_ROUTER --repo jishanh776600-svg/yt-automation
          gh secret delete TEMP_MIGRATE_TOKEN --repo jishanh776600-svg/yt-automation
          echo "Secret migration completed successfully."
