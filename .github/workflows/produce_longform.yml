name: YouTube Long-Form Movie Explainer Producer
# ==============================================================================
# WEEKLY CLOUD LONG-FORM PRODUCER: 8-12 Min Movie Explainer Generator
# Autonomous weekly production of deep-dive cult thriller & horror movie recaps.
# Slices verified footage, synthesizes narration, compiles 16:9 landscape 1080p,
# and deposits into Google Drive Vault (01_READY_LONG).
# Schedule: Weekly Saturday 18:00 UTC (Publishes Sunday).
# ==============================================================================

on:
  schedule:
    # Runs every Saturday at 18:00 UTC
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      movie_title:
        description: 'Specific movie title to produce (leave blank for random unproduced from catalog)'
        required: false
        default: ''
        type: string
      active_voice:
        description: 'Voice identifier for long-form narration'
        required: false
        default: 'af_bella'
        type: string

permissions:
  contents: write

concurrency:
  group: longform-producer
  cancel-in-progress: false

jobs:
  produce_longform_video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Deno for yt-dlp challenge execution
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deploy Cloudflare WARP Egress Sidecar
        run: |
          echo "[*] Launching Cloudflare WARP egress sidecar..."
          docker run -d \
            --name warp \
            --restart always \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            -p 127.0.0.1:1080:1080 \
            caomingjun/warp

          echo "[*] Waiting for WARP proxy to become healthy..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 1080 2>/dev/null; then
              echo "[+] WARP proxy listening on 127.0.0.1:1080"
              break
            fi
            sleep 1
          done

      - name: Restore OAuth Credentials & Environment Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env
          if [ -n "${GEMINI_API_KEY_SECONDARY}" ]; then
            echo "GEMINI_API_KEY_SECONDARY=${GEMINI_API_KEY_SECONDARY}" >> .env
          fi
          if [ -n "${GROQ_API_KEY}" ]; then
            echo "GROQ_API_KEY=${GROQ_API_KEY}" >> .env
          fi
          if [ -n "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" >> .env
          fi
          echo "YOUTUBE_PROXY=socks5h://127.0.0.1:1080" >> .env
          echo "TEST_MODE=false" >> .env
          echo "KOKORO_VOICE=${{ inputs.active_voice || 'af_bella' }}" >> .env
          echo "${TOKEN_JSON}" > token.json
          echo "${CLIENT_SECRET_JSON}" > client_secret.json

      - name: Download & Verify Canonical Database from Cloud Vault
        run: |
          python -m core.database_sync download

      - name: Produce Long-Form Movie Explainer
        run: |
          SPECIFIC_MOVIE="${{ inputs.movie_title }}"
          VOICE="${{ inputs.active_voice || 'af_bella' }}"
          python -c "
import sys
from intelligence.cloud_orchestrator import CloudProductionOrchestrator
from core.movie_catalog import MovieCatalogManager
from engines.drive_engine import DriveVaultEngine
from core.database import SessionLocal

drive = DriveVaultEngine()
orchestrator = CloudProductionOrchestrator(drive_engine=drive, voice_id='$VOICE')
catalog = MovieCatalogManager()

chosen = None
if '$SPECIFIC_MOVIE':
    chosen = catalog.get_movie_by_title('$SPECIFIC_MOVIE')
if not chosen:
    all_movies = catalog.get_all_movies()
    db = SessionLocal()
    unproduced = [m for m in all_movies if not orchestrator.is_movie_already_produced(m, db)]
    db.close()
    if unproduced:
        chosen = unproduced[0]

if not chosen:
    print('[!] No suitable movie found for long-form explainer.')
    sys.exit(0)

print(f'[*] Commencing 10-18 min long-form explainer for: {chosen.title} ({chosen.year})')
mp4_path = orchestrator.movie_longform_engine.produce_longform_explainer(chosen)
if mp4_path and mp4_path.exists():
    print(f'[+] Explainer rendered successfully: {mp4_path.name}')
    file_id = orchestrator.movie_longform_engine.deposit_longform_to_vault(mp4_path, chosen, drive)
    print(f'[+] Deposited into 01_READY_LONG Drive vault (ID: {file_id})')
else:
    print('[-] Long-form explainer production did not complete.')
    sys.exit(1)
"

      - name: Upload & Synchronize Database to Cloud Vault
        if: always()
        run: |
          python -m core.database_sync upload

      - name: Commit Production Records
        if: always()
        run: |
          git config --global user.name 'YouTube Producer Bot'
          git config --global user.email 'bot@github-actions.local'
          git add data/assets/ data/captions/ data/production_summary.json data/movie_series_state.json 2>/dev/null || true
          git commit -m "Auto-update long-form producer database records [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
