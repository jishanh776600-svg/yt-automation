name: AI Provider Connectivity Test
on: workflow_dispatch

jobs:
  test_connectivity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install python-dotenv

      - name: Run Live Provider Connectivity Test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -c '
          import os
          from core.gemini_client import GeminiClient

          groq_key = os.getenv("GROQ_API_KEY", "")
          openrouter_key = os.getenv("OPENROUTER_API_KEY", "")

          groq_detected = "YES" if bool(groq_key) else "NO"
          openrouter_detected = "YES" if bool(openrouter_key) else "NO"

          print(f"CHECK: GROQ_API_KEY detected: {groq_detected}")
          print(f"CHECK: OPENROUTER_API_KEY detected: {openrouter_detected}")

          candidate_models = ["llama-3.1-8b-instant", "llama3-70b-8192", "mixtral-8x7b-32768"]
          success = False

          for model_name in candidate_models:
              try:
                  client = GeminiClient(api_key="", secondary_api_key="", groq_api_key=groq_key, groq_model=model_name)
                  res = client._execute_groq_request(api_key=groq_key, model=model_name, contents="Reply with exactly: GROQ_OK")
                  print(f"GROQ_MODEL_SUCCESS: {model_name}")
                  print("GROQ_CALL: PASS")
                  if hasattr(res, "text") and res.text:
                      print("GROQ_PARSING: PASS")
                      print("GROQ_RESPONSE:", res.text.strip())
                      success = True
                      break
              except Exception as e:
                  print(f"MODEL {model_name} FAILED: {e}")

          if not success:
              print("GROQ_CALL: FAIL")
              print("GROQ_PARSING: FAIL")

          print("OPENROUTER_CALL: NOT_IMPLEMENTED")
          print("OPENROUTER_PARSING: NOT_IMPLEMENTED")
          '
