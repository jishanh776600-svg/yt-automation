name: AI Provider Connectivity Test
on: workflow_dispatch

jobs:
  test_connectivity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install python-dotenv

      - name: Run Live Provider Connectivity Test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -c '
          import os
          import json
          import urllib.request
          from core.gemini_client import GeminiClient

          groq_key = os.getenv("GROQ_API_KEY", "")
          openrouter_key = os.getenv("OPENROUTER_API_KEY", "")

          groq_detected = "YES" if bool(groq_key) else "NO"
          openrouter_detected = "YES" if bool(openrouter_key) else "NO"

          print(f"CHECK: GROQ_API_KEY detected: {groq_detected}")
          print(f"CHECK: OPENROUTER_API_KEY detected: {openrouter_detected}")

          # Check available Groq models
          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/models",
              headers={"Authorization": f"Bearer {groq_key}", "Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  models_data = json.loads(resp.read().decode())
                  model_ids = [m["id"] for m in models_data.get("data", [])]
                  print("AVAILABLE_GROQ_MODELS:", sorted(model_ids))
                  # Pick first active chat model e.g. llama3-70b-8192 or llama-3.1-70b-versatile
                  active_model = None
                  for m in ["llama-3.3-70b-versatile", "llama-3.1-70b-versatile", "llama-3.1-8b-instant", "llama3-70b-8192", "mixtral-8x7b-32768"]:
                      if m in model_ids:
                          active_model = m
                          break
                  if not active_model and model_ids:
                      active_model = model_ids[0]
                  print(f"SELECTED_MODEL: {active_model}")

                  client = GeminiClient(api_key="", secondary_api_key="", groq_api_key=groq_key, groq_model=active_model)
                  res = client._execute_groq_request(api_key=groq_key, model=active_model, contents="Reply with exactly: GROQ_OK")
                  print("GROQ_CALL: PASS")
                  if hasattr(res, "text") and res.text:
                      print("GROQ_PARSING: PASS")
                      print("GROQ_RESPONSE:", res.text.strip())
                  else:
                      print("GROQ_PARSING: FAIL")
          except Exception as e:
              print(f"GROQ_CALL: FAIL ({e})")
              print("GROQ_PARSING: FAIL")

          print("OPENROUTER_CALL: NOT_IMPLEMENTED")
          print("OPENROUTER_PARSING: NOT_IMPLEMENTED")
          '
