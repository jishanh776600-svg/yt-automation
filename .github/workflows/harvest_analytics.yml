name: Scheduled YouTube Analytics Harvester
# ==============================================================================
# SCHEDULED ANALYTICS HARVESTER: Daily Performance Telemetry (1x Daily)
# Polls YouTube Data API & Analytics API for published Shorts (>24h mature).
# Records immutable time-series PerformanceSnapshots into SQLite.
# Execution Time: ~15-30 seconds. Does NOT generate videos or publish to YouTube.
# ==============================================================================

on:
  schedule:
    # Runs once daily at 03:00 UTC (8:30 AM IST), allowing overnight YouTube metrics to settle
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows on-demand manual harvest from GitHub Web / Mobile

permissions:
  contents: write

concurrency:
  group: pipeline-cloud-execution
  cancel-in-progress: false

jobs:
  harvest_daily_metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OAuth Credentials & Environment Secrets
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          echo "PEXELS_API_KEY=${PEXELS_API_KEY}" > .env
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env
          echo "TEST_MODE=false" >> .env
          echo "${TOKEN_JSON}" > token.json
          echo "${CLIENT_SECRET_JSON}" > client_secret.json

      - name: Download & Verify Canonical Database from Cloud Vault
        run: |
          python -m core.database_sync download

      - name: Harvest YouTube Performance Snapshots
        run: |
          python main.py --harvest-analytics

      - name: Upload & Synchronize Database to Cloud Vault
        if: success()
        run: |
          python -m core.database_sync upload

      - name: Commit Performance Snapshots & Updated Database
        if: always()
        run: |
          git config --global user.name 'Analytics Harvester Bot'
          git config --global user.email 'bot@github-actions.local'
          git add data/LEARNING_LOG.md 2>/dev/null || true
          git commit -m "Auto-harvest daily YouTube performance snapshots [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
