<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script>
        if ((window.innerWidth <= 768 || /Mobi|Android|iPhone|iPad|Phone/i.test(navigator.userAgent)) && !window.location.search.includes('mobile=true')) {
            window.location.replace('/login?mobile=true');
        }
    </script>
    <title>AL AMR // Operations Access</title>
    <link rel="icon" type="image/svg+xml" href="/static/branding/al_amr_logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           AL AMR MOBILE-FIRST STANDALONE LOGIN STYLESHEET
           Engineered for 360px, 375px, 390px, 412px Viewports
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-obsidian: #050608;
            --bg-layer1: #080a0d;
            --bg-layer2: #0c0f14;
            --bg-layer3: #11151c;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(56, 189, 248, 0.45);
            --accent-sky: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            min-height: 100vh;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)) 14px;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .login-wrap {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .logo-emblem-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border-radius: 14px;
            background: var(--bg-layer1);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.85);
        }

        .logo-img {
            height: 60px;
            width: auto;
            max-width: 150px;
            object-fit: contain;
        }

        .brand-title {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 1px;
        }

        .login-card {
            background-color: var(--bg-layer2);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 16px 14px;
            box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-header {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
        }

        .card-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 14px;
        }

        .error-banner {
            display: none;
            padding: 8px 10px;
            background: rgba(136, 19, 55, 0.7);
            border: 1px solid #e11d48;
            border-radius: 8px;
            color: #fecdd3;
            font-size: 11px;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-field {
            width: 100%;
            height: 44px;
            background-color: var(--bg-layer1);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 0 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 150ms;
        }

        .input-field:focus {
            border-color: var(--accent-sky);
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            min-height: 48px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);
            transition: opacity 120ms, transform 120ms;
        }

        .btn-submit:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .security-footer {
            text-align: center;
            font-size: 10px;
            color: var(--text-dim);
            padding-top: 2px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="login-wrap">

        <!-- Logo & Header -->
        <div class="brand-header">
            <div class="logo-emblem-box">
                <img src="/static/branding/al_amr_logo_transparent.png" alt="AL AMR Brand Emblem" class="logo-img">
            </div>
            <div>
                <h1 class="brand-title">AL AMR Autonomous System</h1>
                <p class="brand-subtitle font-mono">Operator Authentication</p>
            </div>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="card-header">
                <h2 class="card-title">Operator Access</h2>
                <p class="card-desc">Authenticate session to open control center.</p>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="error-banner font-mono">
                <span>✕</span>
                <span id="error-text">Invalid credentials. Please retry.</span>
            </div>

            <!-- Form -->
            <form id="login-form" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 10px;">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        class="input-field"
                        placeholder="Operator username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="input-field font-mono"
                        placeholder="••••••••••••">
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">
                    <span id="btn-text">Authenticate Session</span>
                    <span id="btn-spinner" class="hidden font-mono" style="animation: spin 1s linear infinite;">↻</span>
                </button>
            </form>

            <div class="security-footer font-mono">
                <span>🔒 Protected by PBKDF2-HMAC & Rate-Limiting</span>
            </div>
        </div>

    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorBanner = document.getElementById('error-banner');
            const errorText = document.getElementById('error-text');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            errorBanner.style.display = 'none';
            submitBtn.disabled = true;
            btnSpinner.classList.remove('hidden');
            btnText.innerText = 'Verifying...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Authentication failed');
                }

                btnText.innerText = 'Redirecting...';
                
                // Authoritative mobile route preservation
                const isMob = window.innerWidth <= 768 
                    || /Mobi|Android|iPhone|iPad|Phone/i.test(navigator.userAgent) 
                    || window.location.search.includes('mobile=true') 
                    || window.location.pathname === '/mobile';
                
                setTimeout(() => {
                    window.location.replace(isMob ? '/mobile' : '/');
                }, 50);
            } catch (err) {
                errorBanner.style.display = 'flex';
                errorText.innerText = err.message || 'Authentication failed. Please verify credentials.';
                submitBtn.disabled = false;
                btnSpinner.classList.add('hidden');
                btnText.innerText = 'Authenticate Session';
            }
        }
    </script>
</body>
</html>
