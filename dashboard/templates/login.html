<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script>
        if ((window.innerWidth <= 768 || /Mobi|Android|iPhone|iPad|Phone/i.test(navigator.userAgent)) && !window.location.search.includes('mobile=true')) {
            window.location.replace('/login?mobile=true');
        }
    </script>
    <title>AL AMR // Operations Access</title>
    <link rel="icon" type="image/svg+xml" href="/static/branding/al_amr_logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        obsidian: '#050608',
                        layer1: '#080a0d',
                        layer2: '#0c0f14',
                        layer3: '#11151c',
                    }
                }
            }
        }
    </script>
    <style>
        /* Comprehensive Self-Contained Fallback & Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #050608;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .login-wrap {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
        }
        .obsidian-card {
            background-color: #0c0f14;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.85);
        }
        .input-field {
            width: 100%;
            background-color: #080a0d;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 150ms;
        }
        .input-field:focus {
            border-color: #38bdf8;
        }
        .btn-submit {
            width: 100%;
            min-height: 48px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 120ms, transform 120ms;
        }
        .btn-submit:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body class="bg-obsidian text-zinc-100 min-h-screen">

    <div class="login-wrap space-y-6">

        <!-- Logo Emblem -->
        <div class="text-center space-y-3">
            <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-layer1 border border-white/[0.06] shadow-2xl shadow-black">
                <img src="/static/branding/al_amr_logo_transparent.png" alt="AL AMR Brand Emblem" class="h-20 sm:h-24 w-auto object-contain">
            </div>
            <div>
                <h1 class="text-base font-semibold text-white tracking-tight">AL AMR Autonomous System</h1>
                <p class="text-xs text-zinc-400 mt-0.5">Operator Authentication</p>
            </div>
        </div>

        <!-- Login Box -->
        <div class="obsidian-card space-y-5">
            <div class="space-y-1">
                <h2 class="text-sm font-medium text-white">Operator Access</h2>
                <p class="text-xs text-zinc-400">Authenticate session to open control center.</p>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="p-3 bg-rose-950/80 border border-rose-800 rounded-xl text-rose-300 text-xs font-mono hidden items-center space-x-2">
                <span>✕</span>
                <span id="error-text">Invalid credentials. Please retry.</span>
            </div>

            <!-- Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs text-zinc-300 font-medium block" for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        class="input-field"
                        placeholder="Operator username">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs text-zinc-300 font-medium block" for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="input-field font-mono"
                        placeholder="••••••••••••">
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">
                    <span id="btn-text">Authenticate Session</span>
                    <span id="btn-spinner" class="hidden animate-spin font-mono">↻</span>
                </button>
            </form>

            <div class="pt-2 text-center text-[11px] font-mono text-zinc-500">
                <span>🔒 Protected by PBKDF2-HMAC & Rate-Limiting</span>
            </div>
        </div>

    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorBanner = document.getElementById('error-banner');
            const errorText = document.getElementById('error-text');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            errorBanner.classList.add('hidden');
            errorBanner.classList.remove('flex');
            submitBtn.disabled = true;
            btnSpinner.classList.remove('hidden');
            btnText.innerText = 'Verifying...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Authentication failed');
                }

                btnText.innerText = 'Redirecting...';
                
                // Authoritative mobile route preservation
                const isMob = window.innerWidth <= 768 
                    || /Mobi|Android|iPhone|iPad|Phone/i.test(navigator.userAgent) 
                    || window.location.search.includes('mobile=true') 
                    || window.location.pathname === '/mobile';
                
                window.location.href = isMob ? '/mobile' : '/';
            } catch (err) {
                errorBanner.classList.remove('hidden');
                errorBanner.classList.add('flex');
                errorText.innerText = err.message || 'Authentication failed. Please verify credentials.';
                submitBtn.disabled = false;
                btnSpinner.classList.add('hidden');
                btnText.innerText = 'Authenticate Session';
            }
        }
    </script>
</body>
</html>
